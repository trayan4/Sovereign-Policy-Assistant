services:
  # Local, self-hosted identity provider - the offline substitute for
  # Azure IAM/Entra ID this project needs (see README's security section).
  # Dev mode (start-dev) is deliberately used here: it's the right choice
  # for proving the mechanism works on one machine, but is NOT a
  # production configuration (in-memory-backed, relaxed defaults) - a
  # real rollout needs `start` with a real database and TLS, plus
  # federating against the bank's actual Active Directory instead of the
  # two hand-defined demo accounts below. --import-realm loads
  # keycloak/realm-export.json automatically on first boot: two roles
  # (standard_staff, cleared_staff) and two test accounts
  # (standard_user / cleared_user, password demo1234 for both) - enough
  # to demo both clearance levels without a real directory behind it yet.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 'HTTP/1.1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pulls the two models this project needs into the ollama
  # service's volume, then exits. Runs on every `docker compose up`, but
  # `ollama pull` is a no-op once a model is already present, so this is
  # only slow on first run. Retries on failure: `ollama pull` run this way
  # (a separate container's CLI against a remote OLLAMA_HOST, right after
  # the server reports healthy) has been observed to fail transiently on
  # the very first attempt even though the exact same command succeeds on
  # a retry - a startup race rather than anything wrong with the pull
  # itself, so a short retry loop is more robust than chasing that further.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    # A shell for-loop here is fragile inside YAML's folded-scalar line
    # joining (tried it, it silently mangles), so retries are just
    # written out explicitly instead. List form (one element = one arg to
    # -c) so compose passes this string through as-is, rather than trying
    # to shell-split it as a plain scalar and choking on &&/||/().
    command:
      - >-
        (ollama pull gemma2:2b && ollama pull bge-m3) ||
        (sleep 5 && ollama pull gemma2:2b && ollama pull bge-m3) ||
        (sleep 5 && ollama pull gemma2:2b && ollama pull bge-m3) ||
        (sleep 10 && ollama pull gemma2:2b && ollama pull bge-m3)

  app:
    build: .
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=sovereign-policy
      - KEYCLOAK_CLIENT_ID=sovereign-policy-app
    volumes:
      - ./chroma_store:/srv/chroma_store
      # Bind-mounted (rather than relying only on the image's baked-in COPY)
      # so a manual re-ingest (`docker compose run --rm app python
      # scripts/ingest.py`) and the watcher service below both see whatever
      # is currently on the host, not a stale snapshot from whenever the
      # image was last built. The bind mount shadows the image's copy at
      # runtime; the Dockerfile COPY stays only so the image is still
      # self-contained for the no-compose `docker save`/`docker load` export
      # path documented in the README.
      - ./policy_library:/srv/policy_library
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Watches the host's policy_library/ (bind-mounted, see `app` above) for
  # new or changed PDFs and re-runs ingestion automatically - the
  # SharePoint-folder-drop simulation from the original project plan.
  # Reuses the `app` image (already has watchdog + the full ingestion
  # pipeline as a dependency) rather than a separate Dockerfile, just with a
  # different command.
  watcher:
    build: .
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # Without this, Python block-buffers stdout when it isn't a TTY (true
      # for any container process), so the watcher's print() logging
      # ("Detected change...", "Re-indexing...") sits in a buffer instead
      # of reaching `docker compose logs` in anything close to real time -
      # confirmed by testing: logs stayed empty for a running container
      # until this was added.
      - PYTHONUNBUFFERED=1
    volumes:
      - ./chroma_store:/srv/chroma_store
      - ./policy_library:/srv/policy_library
    command: ["python", "scripts/watch_folder.py"]

  # Thin Streamlit front end - talks to `app` over HTTP only, never touches
  # Chroma/Ollama/the LangGraph pipeline directly, so it's a separate,
  # much smaller image (see ui/Dockerfile) that can be rebuilt or redeployed
  # independently of the backend.
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      - API_URL=http://app:8000
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=sovereign-policy
      - KEYCLOAK_CLIENT_ID=sovereign-policy-app
    ports:
      - "8501:8501"

volumes:
  ollama_data:
